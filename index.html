
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S2BTI - AR Satelit</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>s
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #edf4fb;
      color: #17365d;
    }
    header {
      background: #17365d;
      color: white;
      padding: 22px 12px;
    }
    h1 { margin: 0 0 8px; }
    p { line-height: 1.5; }
    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: white;
    }
    .info { padding: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>S2BTI</h1>
    <p>Showcase Satellite Beyond The Imagination</p>
  </header>

  <div class="info">
    <h2>AR Satelit 3D</h2>
    <p>Lihat dan teroka reka bentuk satelit inovasi anda.</p>
  </div>

  <model-viewer
    id="satelit"
    src="Terra.glb"
    alt="Model 3D satelit S2BTI"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer webxr quick-look"
    shadow-intensity="1">
    <button slot="ar-button"
      style="padding:12px 20px;border-radius:10px;background:#1769aa;color:white;border:0;">
      Lihat Satelit dalam AR
    </button>
  </model-viewer>

  <div class="info">
    <p>Projek Inovasi STEM | S2BTI</p>
  </div>
</body>
</html>
